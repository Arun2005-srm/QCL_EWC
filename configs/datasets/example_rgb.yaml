defaults: ../default.yaml
dataset:
  name: rgb_masks
  images:
    root: ../../datasets/rgb/images
  masks:
    root: ../../datasets/rgb/masks
  labels:
    encoding: rgb
    colors:
      "0,0,0": 0
      "255,0,0": 1
      "0,255,0": 2
      "0,0,255": 3
      "255,255,0": 4
      "255,255,255": 255
